name: Build and Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select_macos_runner:
    name: Select macOS runner
    if: github.repository == 'agoodkind/mlx-swift'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - name: Use the shared macOS runner selector
        id: runner
        uses: agoodkind/swift-makefile/.github/actions/plan-runner@main
        with:
          runner: macos-26
          capacity-token: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}

  encuda_process_tests:
    name: Encuda Process Tests (Linux)
    if: github.repository == 'agoodkind/mlx-swift'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    defaults:
      run:
        working-directory: mlx-swift
    steps:
      - name: Install portable build dependencies
        working-directory: ${{ github.workspace }}
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends make curl python3

      - name: Checkout core candidate
        uses: actions/checkout@v6
        with:
          path: mlx-swift
          persist-credentials: false

      - name: Set up Swift maintenance verification
        id: maintenance
        uses: agoodkind/lmd/.github/actions/setup-maintenance@ec18740170edb9c5c2216a9c6fe2789c3d9926b4
        with:
          ref: '2812aa0d79c00cda8185e11182e98ddea59eb6be'
          test-filter: LMDMaintenanceTests

      - name: Build portable subprocess tests
        run: |
          swiftc -swift-version 6 Source/Encuda/encuda-utils.swift \
            Tests/EncudaProcessTests/ProcessTests.swift -o "$RUNNER_TEMP/encuda-process-tests"

      - name: Verify subprocess exit and ownership behavior
        run: '"$RUNNER_TEMP/encuda-process-tests"'

      - name: Verify Linux CUDA plugin identity fixtures
        run: '"${{ steps.maintenance.outputs.binary }}" verify-manifest-fixtures "$GITHUB_WORKSPACE/mlx-swift"'

  fork_regression_tests:
    name: Fork Regression Tests
    if: ${{ always() && (github.repository == 'agoodkind/mlx-swift') }}
    needs: select_macos_runner
    runs-on: ${{ needs.select_macos_runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mlx-swift
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Require successful macOS prerequisites
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SELECTOR_RESULT: ${{ needs.select_macos_runner.result }}
          SELECTED_RUNNER: ${{ needs.select_macos_runner.outputs.label }}
        run: |
          if [[ "$SELECTOR_RESULT" != 'success' || -z "$SELECTED_RUNNER" ]]; then
            echo "::error::The macOS runner selector did not succeed or did not return a runner label."
            exit 1
          fi

      - name: Checkout core candidate
        uses: actions/checkout@v6
        with:
          path: mlx-swift
          submodules: recursive
          persist-credentials: false

      - name: Prepare Xcode and Metal toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -downloadComponent MetalToolchain

      - name: Set up Swift result verification
        id: maintenance
        uses: agoodkind/lmd/.github/actions/setup-maintenance@ec18740170edb9c5c2216a9c6fe2789c3d9926b4
        with:
          ref: '2812aa0d79c00cda8185e11182e98ddea59eb6be'

      - name: Verify subprocess exit and ownership behavior
        run: |
          swiftc -swift-version 6 Source/Encuda/encuda-utils.swift \
            Tests/EncudaProcessTests/ProcessTests.swift -o "$RUNNER_TEMP/encuda-process-tests"
          "$RUNNER_TEMP/encuda-process-tests"

      - name: Verify CUDA manifest containment
        run: |
          python3 scripts/verify-spm-manifest.py
          "${{ steps.maintenance.outputs.binary }}" verify-manifest-fixtures "$GITHUB_WORKSPACE/mlx-swift"

      - name: Run focused core regressions
        run: |
          xcodebuild test \
            -scheme mlx-swift-Package \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/mlx-core-derived" \
            -resultBundlePath "$RUNNER_TEMP/core-fork-regressions.xcresult" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -jobs 4 \
            -only-testing:MLXTests/MLXArrayIndexingTests \
            -only-testing:MLXTests/ForkProtectionTests \
            -only-testing:MLXTests/StreamTests/testDefaultCPUStreamResolvesOnCurrentThread \
            -only-testing:MLXTests/StreamTests/testGPUArrayEvaluatesOnAnotherThread \
            -only-testing:MLXTests/LoggingTests \
            -only-testing:MLXTests/CompileLockOrderingTests

      - name: Verify selected core suites completed
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/core-fork-regressions.xcresult" \
            --compact > "$RUNNER_TEMP/core-fork-regressions.json"
          "${{ steps.maintenance.outputs.binary }}" verify-test-results xcode \
            "$RUNNER_TEMP/core-fork-regressions.json" \
            MLXTests/MLXArrayIndexingTests MLXTests/ForkProtectionTests MLXTests/StreamTests \
            MLXTests/LoggingTests MLXTests/CompileLockOrderingTests

      - name: Build compile-lock stress diagnostic
        run: |
          xcodebuild build -scheme CompileLockRepro -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/mlx-core-derived" \
            -skipPackagePluginValidation -jobs 4

      - name: Verify compile-lock diagnostic exit behavior
        run: '"${{ steps.maintenance.outputs.binary }}" verify-compile-lock-repro "$RUNNER_TEMP/mlx-core-derived/Build/Products/Debug/CompileLockRepro"'

      - name: Upload core regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-fork-regressions
          path: |
            ${{ runner.temp }}/core-fork-regressions.xcresult
            ${{ runner.temp }}/core-fork-regressions.json
          if-no-files-found: error

  lint:
    if: github.repository == 'ml-explore/mlx-swift'
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-rhel-ubi9
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Setup pre-commit
        shell: sh
        run: |
          uv pip install pre-commit

      - name: Get swift-format tag
        id: swift-format
        shell: sh
        run: |
          cd /tmp
          LATEST_TAG=$(curl -s https://api.github.com/repos/swiftlang/swift-format/releases/latest | \
            grep '"tag_name":' | \
            sed -E 's/.*"([^"]+)".*/\1/')
          echo "swift-format $LATEST_TAG"
          echo "SWIFT_FORMAT_VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Cache swift-format build
        uses: actions/cache@v4
        id: cache-swift-format
        with:
          path: /tmp/swift-format/.build
          key: ${{ runner.os }}-swift-format-build-${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }}

      - name: Build swift-format
        if: steps.cache-swift-format.outputs.cache-hit != 'true'
        shell: sh
        run: |
          cd /tmp
          git clone --branch ${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }} --depth 1 https://github.com/swiftlang/swift-format.git
          cd swift-format
          swift build -c release

      - name: Link swift-format to /usr/local/bin
        shell: sh
        run: |
          cd /tmp/swift-format
          ln -s "$(swift build --show-bin-path -c release)/swift-format" /usr/local/bin/swift-format

      - name: Configure safe directory for git
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run style checks
        shell: sh
        run: |
          pre-commit run --all || (echo "Style checks failed, please install pre-commit and run pre-commit run --all and push the change"; echo ""; git --no-pager diff; exit 1)


  mac_build_and_test:
    needs: lint
    if: github.repository == 'ml-explore/mlx-swift'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify MetalToolchain installed
        shell: bash
        run: xcodebuild -showComponent MetalToolchain

      - name: Verify SwiftPM manifest CUDA containment
        run: scripts/verify-spm-manifest.py

      - name: Setup cmake
        shell: sh
        run: |
          brew install cmake ninja

      - name: Verify documentation
        run: scripts/verify-docs.sh

      - name: Build SwiftPM (Xcode, iOS)
        shell: sh
        run: |
          xcodebuild -version
          swift --version
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild build -scheme mlx-swift-Package -destination 'generic/platform=iOS'

      - name: Build SwiftPM (Xcode, macOS)
        shell: sh
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        run: |
          xcodebuild -version
          swift --version
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild build-for-testing -scheme mlx-swift-Package -destination 'platform=macOS'

      - name: Run Tests SwiftPM (Xcode, macOS)
        shell: sh
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        run: |
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/CmlxTests.xctest
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/MLXTests.xctest
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/MLXIntegrationTests.xctest

      - name: Run Distributed Tests SwiftPM (Xcode, macOS)
        shell: sh
        run: |
          MLX_TEST_DISTRIBUTED=1 xcrun xctest -XCTest DistributedRingTests ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/MLXTests.xctest
          MLX_TEST_DISTRIBUTED=1 xcrun xctest -XCTest DistributedNNRingTests ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/MLXTests.xctest

      - name: Build xcodeproj (Xcode, macOS)
        shell: sh
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd xcode
          xcodebuild build-for-testing -scheme MLX -destination 'platform=macOS'

      - name: Run Tests xcodeproj (Xcode, macOS)
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        working-directory: xcode
        run: ../.github/scripts/run-xcode-tests.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7

      - name: Build (cmake)
        shell: sh
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -G Ninja
          ninja

  linux_build_cmake_container:
    name: Linux Container CMake Swift Build (${{ matrix.container }} ${{ matrix.arch }})
    needs: lint
    if: github.repository == 'ml-explore/mlx-swift'
    strategy:
      fail-fast: false
      matrix:
        include:
          # See https://github.com/swiftlang/swift-docker/tree/main/
          #
          # Note: mlx-c uses std::format, which requires libstdc++ >= 13 (or
          # libc++ >= 17).  Debian bookworm only ships gcc/libstdc++ 12 (and
          # gcc-13 is not available in bookworm-backports), so use Ubuntu
          # noble (24.04, gcc/libstdc++ 13) for the Debian-family build.
          - host: ubuntu-22.04
            arch: x86_64
            container: swift:noble
          - host: ubuntu-22.04
            arch: x86_64
            container: swift:fedora39
          - host: ubuntu-22.04-arm
            arch: aarch64
            container: swift:noble
          - host: ubuntu-22.04-arm
            arch: aarch64
            container: swift:fedora39

    runs-on: ${{ matrix.host }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Linux Container CMake Swift Build - No Release
        run: |
          bash .github/scripts/setup+build-linux-container-cmake.sh

  linux_build_cmake_cuda:
    name: Linux CUDA CMake Swift Build (cuda-12.9, swift-6.2.3-RELEASE, ubuntu-24.04, x86_64)
    needs: lint
    if: github.repository == 'ml-explore/mlx-swift'
    runs-on: "gpu-t4-4-core"
    env:
      # Note 12/18/2025: the CI machine does not meet CUDA 13's driver requirement.
      # Compatibility matrix:
      # https://docs.nvidia.com/deeplearning/cudnn/backend/latest/reference/support-matrix.html
      TOOLKIT_VERSION: "cuda-12.9"
      SWIFT_VERSION: "swift-6.2.3-RELEASE"
      # pub   rsa4096 2024-09-16 [SC] [expires: 2026-09-16]
      #      52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
      # uid           [ unknown] Swift 6.x Release Signing Key <swift-infrastructure@forums.swift.org>
      SWIFT_SIGNING_KEY: "52BB7E3DE28A71BE22EC05FFEF80A866B47A981F"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Linux CUDA Setup
        run: |
          bash .github/scripts/setup-linux-cuda.sh

      - name: Linux CUDA CMake Swift Build - No Release
        run: |
          bash .github/scripts/build-linux-cuda-cmake.sh
