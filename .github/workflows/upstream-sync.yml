name: 🔄 Auto-Sync Upstream

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # Every day at 4:00 AM UTC
  workflow_dispatch: # Enable manual triggers

permissions: {}

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test upstream synchronization
        run: node --test .github/scripts/upstream-sync.test.mjs

  sync:
    needs: regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure Git credentials
        env:
          GH_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
        run: gh auth setup-git --hostname github.com

      - name: Update upstream candidate
        id: sync_branch
        env:
          GH_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
          SYNC_UPSTREAM_URL: https://github.com/ml-explore/mlx-swift.git
        run: node .github/scripts/upstream-sync.mjs sync

      - name: Create or update pull request
        if: steps.sync_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
        run: node .github/scripts/upstream-sync.mjs pr
